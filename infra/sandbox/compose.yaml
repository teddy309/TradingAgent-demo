name: ${COMPOSE_PROJECT_NAME:-tradingagent}

services:
  hermes-sandbox:
    build:
      context: ../..
      dockerfile: infra/sandbox/Dockerfile
      args:
        HERMES_BASE_IMAGE: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-latest}
    image: tradingagent/hermes-sandbox:${HERMES_IMAGE_TAG:-latest}
    container_name: tradingagent-hermes-sandbox
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      HOME: /opt/data
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Asia/Seoul
      DISPLAY: ":1"
      BROWSER: chromium
      PATH: /opt/data/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      XDG_CURRENT_DESKTOP: XFCE
      XDG_RUNTIME_DIR: /opt/data/run
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_REDACT_SECRETS: "true"
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace/trading-agent:/knowledge/trading
      NOVNC_GEOMETRY: 1440x900
      PYTHONPATH: /workspace/trading-agent/src
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - hermes-data:/opt/data
      - ../..:/workspace/trading-agent:ro
      # Hide the existing dashboard secret file inside the repository mount.
      - /dev/null:/workspace/trading-agent/infra/sandbox/.env:ro
      - type: bind
        source: ${LLM_WIKI_PATH:?Run ./scripts/sandbox.sh bootstrap first}
        target: /knowledge/trading
        read_only: false
    working_dir: /workspace/trading-agent
    read_only: true
    tmpfs:
      # s6-overlay extracts and executes its stage binaries under /run.
      - /run:rw,exec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=512m
      - /var/tmp:rw,noexec,nosuid,size=256m
    shm_size: 512m
    pids_limit: 512
    cpus: 2.0
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null &&
          curl -fsS http://127.0.0.1:9119/api/status >/dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  kis-proxy:
    build:
      context: ../..
      dockerfile: infra/kis/Dockerfile
    image: tradingagent/kis-proxy:readonly-v1
    restart: unless-stopped
    secrets:
      - kis_env
    volumes:
      - trading-ledger:/state
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  kis_env:
    # Outside the checkout mounted into Hermes; never add to sandbox .env.
    file: ../../../.private/kis.env

volumes:
  hermes-data:
    name: tradingagent-hermes-data
  trading-ledger:
    name: tradingagent-ledger
